name: Check KPM package

on:
  push:
    paths: ["kpm/**", ".github/workflows/kpm-*.yml"]
  pull_request:
    paths: ["kpm/**", ".github/workflows/kpm-*.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s kpm/tests -v
      - run: python kpm/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: kpm-repository-preview
          path: build/site
          include-hidden-files: true
