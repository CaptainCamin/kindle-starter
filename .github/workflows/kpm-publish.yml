name: Publish KPM repository

# Publishing is deliberately manual, not a side effect of a push or pull request.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kpm-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s kpm/tests -v
      - run: python kpm/build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy static repository
        id: deployment
        uses: actions/deploy-pages@v4
